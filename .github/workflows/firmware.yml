name: Firmware build and tests
on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Arm C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Host C tests
        run: python3 firmware/tools/test.py --cc gcc
      - name: Protocol and TCP server tests
        run: python3 -m unittest discover -s firmware/tests -p test_server.py -v
      - name: Fetch pinned vendor drivers
        run: python3 firmware/tools/fetch_vendor.py
      - name: Build STM32 firmware
        run: python3 firmware/tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: stm32l476-one-shot
          path: |
            firmware/build/gps.elf
            firmware/build/gps.hex
            firmware/build/gps.map
